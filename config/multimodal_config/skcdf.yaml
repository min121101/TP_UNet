seed: 101
debug: False # set debug=True for a fast smoke test on a tiny subset
exp_name: 'SKCDF'
comment: 'SKCDF'
model_name: 'SKCDF'
train_bs: 4
valid_bs: 4
debug_train_bs: 10
debug_valid_bs: 10
img_size: [192, 192]
epochs: 30
lr: 0.00005
scheduler: 'CosineAnnealingLR'
min_lr: 0.00000001
T_max: int(30000/train_bs*epochs)+50
T_0: 40
warmup_epochs: 0
wd: 0.000001
n_accumulate: max(1, 32//train_bs)
n_fold: 5
num_classes: 1
attention: None
use_multimodal_data: False
2.5D: False
# dataloader / perf (2D supervised only; no text encoder)
num_workers: 4
wandb_watch: False
cudnn_benchmark: True
skcdf_n_filters: 32
skcdf_norm: 'batchnorm'
skcdf_dropout: True
skcdf_num_heads: 4
skcdf_abc_w: 0.5
