# Single GPU (physical id). Override: python ... --gpu 0
cuda_visible_devices: "0"
seed: 101
debug: False # set debug=False for Full Training
exp_name: 'SKCDF_TP'
comment: 'SKCDF_TP'
model_name: 'SKCDF_TP'
train_bs: 8
valid_bs: 8
debug_train_bs: 10
debug_valid_bs: 10
img_size: [192, 192]
epochs: 30
# SKCDF_TP: temporal-prompt only (no contrastive); grad clip helps stability.
wandb_project: TP-UNet
wandb_entity: Your_Entity
lr: 0.0001
max_grad_norm: 1.0
scheduler: 'CosineAnnealingLR'
min_lr: 0.00000001
T_max: int(30000/train_bs*epochs)+50
T_0: 40
warmup_epochs: 0
wd: 0.000001
n_accumulate: max(1, 32//train_bs)
n_fold: 5
num_classes: 1
attention: None
use_multimodal_data : True
2.5D: False
num_workers: 4
wandb_watch: False
cudnn_benchmark: True
skcdf_n_filters: 16
skcdf_norm: 'batchnorm'
skcdf_dropout: True
skcdf_num_heads: 4
# Electra last_hidden_state: max_length=5 in code, hidden 256 for electra-small-discriminator.
# Skip_CrossAtt memory is O((L*H*W)^2); shallow x2 uses L=1 (mean over T). Bottleneck still sees full T*D.
skcdf_temporal_in_dim: 1280
skcdf_temporal_hidden_dim: 256
skcdf_temporal_len: 5
skcdf_lang_dim: 512
# Learnable scale on bottleneck temporal bias (starts small; last Linear is zero-init)
skcdf_tp_bn_gate_init: 0.12
# Same auxiliary head weighting as SKCDF baseline
skcdf_abc_w: 0.5
